<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一点一点 · 学习时间管理</title><link rel="stylesheet" href="style.css"><body><header><b>◷ 一点一点</b><span>把每天的努力，变成看得见的成长</span><button id="export">导出记录</button></header><main><section class="intro"><small>YOUR DAILY STUDY COMPANION</small><h1>今天，也向前一点点。</h1><p id="date"></p></section><div class="layout"><div><section class="card"><h2>01 / 安排今天</h2><p>先列出今天的作业，也别忘了上次未完成的任务。</p><div id="carry"></div><textarea id="input" placeholder="每行一项，例如：&#10;7-语文三新&#10;19:50-数学练习 30分钟&#10;英语单词 20分钟"></textarea><div class="row"><label>默认开始 <input id="start" type="time" value="19:00"></label><label>时长 <input id="duration" type="number" min="5" max="240" value="40"> 分钟</label></div><div class="row"><button id="voice">🎙 语音输入</button><button class="primary" id="generate">一键整理计划 ↗</button></div><p class="hint">支持“7-语文三新”；1–11点默认理解为晚上。生成后可修改目标、时长和标准。</p><p id="message" role="status"></p></section><section class="card"><div class="row"><h2>02 / 今天的清单</h2><span id="progress"></span></div><div id="tasks"></div></section></div><aside><section class="card focus"><small>专注当下这一件事</small><h2 id="active">准备好就开始吧</h2><div id="clock">00:00</div><p id="timernote">选择一项任务，开始专注</p><button id="pause">暂停 / 继续</button></section><section class="card"><div class="row"><button id="prev">‹</button><h2 id="month"></h2><button id="next">›</button></div><div class="calendar" id="calendar"></div><p class="hint">● 有开始记录　✓ 全部完成</p><h3 id="reviewtitle">今日复盘</h3><div id="review"></div><textarea id="reflection" placeholder="今天学到了什么？明天想改善什么？"></textarea><button id="saveReflection">保存复盘</button></section></aside></div><footer>每完成一小步，都值得被记录。 · 数据仅保存在当前浏览器，请定期导出备份。</footer></main><script src="app.js"></script></body></html>
